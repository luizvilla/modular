<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>modular</title>
	<meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="viewport" content = "width = device-width, initial-scale = 1, user-scalable = no" />
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/darkly/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="css/freeboard.min.css" rel="stylesheet" />
    <link href="css/bootstrap-overrides.css" rel="stylesheet" />
    <!-- Tabs + docs UI styles for in-app documentation. -->
    <link href="css/tabs.css" rel="stylesheet" />
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script src="js/runtime_diagnostics.js"></script>
    <script src="js/freeboard.thirdparty.js"></script>
    <script src="lib/js/thirdparty/colorschemes.tableau.js"></script>
    <script src="lib/js/thirdparty/colorschemes.office.js"></script>
    <script src="js/freeboard.js"></script>
    <script src="js/expr_utils.js"></script>
    <script src="plugins/thirdparty/eve.js"></script>
    <script src="plugins/thirdparty/raphael.2.1.0.min.js"></script>
    <script src="plugins/thirdparty/jquery.sparkline.min.js"></script>   
    <script src="plugins/thirdparty/justgage.1.0.1.js"></script>
    <!-- <script src="plugins/thirdparty/chartjs-plugin-streaming.min.js"></script>    -->
    <script type="text/javascript">
        (function () {
            // Ensure Freeboard exists before loading plugins (prevents "freeboard is not defined").
            function getExtensionBootstrap() {
                if (!window.api || !window.api.extensions || typeof window.api.extensions.getBootstrap !== "function") {
                    console.error("Extension bootstrap unavailable: window.api.extensions.getBootstrap() missing.");
                    return Promise.resolve({ rendererScripts: [] });
                }
                return window.api.extensions.getBootstrap().catch(function (err) {
                    console.error("Failed to load extension bootstrap.", err);
                    return { rendererScripts: [] };
                });
            }

            function getPluginScripts(bootstrap) {
                var rendererScripts = bootstrap && Array.isArray(bootstrap.rendererScripts)
                    ? bootstrap.rendererScripts.slice()
                    : [];
                rendererScripts.sort(function (left, right) {
                    var leftOrder = Number(left && left.order) || 0;
                    var rightOrder = Number(right && right.order) || 0;
                    if (leftOrder !== rightOrder) return leftOrder - rightOrder;
                    var leftPath = String(left && left.path || "");
                    var rightPath = String(right && right.path || "");
                    return leftPath.localeCompare(rightPath);
                });
                return rendererScripts
                    .map(function (entry) { return entry && entry.path; })
                    .filter(function (entry) { return typeof entry === "string" && entry.length > 0; });
            }

            function initFreeboard() {
                $(function () {
                    setTimeout(function () {
                        console.log("✅ Delayed init: Freeboard now initializing.");
                        freeboard.initialize(true);

                        var hashpattern = window.location.hash.match(/(&|#)source=([^&]+)/);
                        if (hashpattern !== null) {
                            $.getJSON(hashpattern[2], function (data) {
                                freeboard.loadDashboard(data, function () {
                                    freeboard.setEditing(false);
                                });
                            });
                        }
                    }, 100); // Short delay to allow plugin to register
                });
            }

            function loadPlugins(bootstrap) {
                var pluginScripts = getPluginScripts(bootstrap);
                head.js.apply(null, pluginScripts.concat([initFreeboard]));
            }

            function waitForFreeboard(retries, bootstrap) {
                if (typeof freeboard !== "undefined" && typeof head !== "undefined") {
                    loadPlugins(bootstrap);
                    return;
                }
                if (retries <= 0) {
                    console.error("Freeboard boot timed out: freeboard or head.js missing.");
                    return;
                }
                setTimeout(function () { waitForFreeboard(retries - 1, bootstrap); }, 25);
            }

            function buildWidgetRegistry(bootstrap) {
                var registry = {};
                var docs = bootstrap && Array.isArray(bootstrap.widgetDocs) ? bootstrap.widgetDocs : [];
                docs.forEach(function (entry) {
                    if (entry && entry.type) registry[entry.type] = entry;
                });
                return registry;
            }

            function buildDatasourceRegistry(bootstrap) {
                var registry = {};
                var sources = bootstrap && Array.isArray(bootstrap.datasources) ? bootstrap.datasources : [];
                sources.forEach(function (entry) {
                    if (entry && entry.type) registry[entry.type] = entry;
                });
                return registry;
            }

            getExtensionBootstrap().then(function (bootstrap) {
                window.__widgetRegistry = buildWidgetRegistry(bootstrap);
                window.__datasourceRegistry = buildDatasourceRegistry(bootstrap);
                waitForFreeboard(200, bootstrap);
            });
        })();
    </script>
</head>
<body>
<header id="top-bar">
    <h1 id="board-logo" class="title bordered">modular</h1>
    <!-- ko if: allow_edit -->
    <ul id="board-actions" class="board-toolbar board-toolbar--header">
        <li id="new-dashboard-btn" title="New dashboard">
            <i class="fa-solid fa-file" aria-hidden="true"></i>
        </li>
        <li title="Open dashboard" data-bind="click: loadDashboardFromLocalFile">
            <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
        </li>
        <li title="Save dashboard" data-bind="click: saveDashboardClicked">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
        </li>
        <li id="add-pane" title="Add pane" data-bind="click: createPane">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
        </li>
    </ul>
    <!-- /ko -->
    <button id="dashboard-lock-btn" title="Lock dashboard" aria-label="Lock dashboard" disabled style="opacity:0.3;cursor:not-allowed;">
        <i class="fa-solid fa-lock-open" aria-hidden="true"></i>
    </button>
    <div id="zoom-controls" title="Zoom (Ctrl+- / Ctrl+=)">
        <button id="zoom-out-btn" aria-label="Zoom out" title="Zoom out (Ctrl+-)">
            <i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i>
        </button>
        <span id="zoom-level-label">100%</span>
        <button id="zoom-in-btn" aria-label="Zoom in" title="Zoom in (Ctrl+=)">
            <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
        </button>
    </div>
    <button id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle light/dark theme" disabled style="opacity:0.3;cursor:not-allowed;">
        <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
</header>
<!-- Documentation panel for example/courseware tabs (hidden until activated). -->
<div id="doc-panel" class="doc-panel" hidden>
    <div class="doc-shell">
        <aside class="doc-sidebar">
            <div class="doc-header">
                <div class="doc-title-block">
                    <h1 id="doc-title">Document</h1>
                    <p id="doc-subtitle" class="subtitle">Docs</p>
                </div>
                <div class="doc-picker">
                    <label for="doc-example-select">Document</label>
                    <select id="doc-example-select"></select>
                </div>
                <div class="doc-actions">
                    <div class="doc-action-buttons">
                        <button id="doc-load-dashboard-btn" class="btn primary">Load document dashboard</button>
                        <button id="doc-upload-firmware-btn" class="btn">Upload document to target</button>
                    </div>
                    <section class="progress-panel">
                        <div class="progress-header">
                            <span id="doc-upload-spinner" class="spinner-border spinner-border-sm text-secondary" role="status" aria-hidden="true"></span>
                            <strong id="doc-upload-title" class="text-truncate">Upload progress</strong>
                            <small id="doc-upload-state" class="text-muted">idle</small>
                        </div>
                        <div id="doc-upload-label" class="small text-muted text-truncate">No upload running</div>
                        <div class="progress" style="height:14px;">
                            <div id="doc-upload-progress-bar" class="progress-bar" role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                        </div>
                    </section>
                </div>
                <div class="doc-port-row">
                    <label for="doc-port-select">Target port</label>
                    <div class="doc-port-controls">
                        <select id="doc-port-select"></select>
                        <button id="doc-refresh-ports-btn" class="btn ghost">Refresh</button>
                    </div>
                </div>
                <div id="doc-status" class="status-bar"></div>
            </div>
        </aside>
        <div class="doc-main">
            <article id="doc-content" class="doc-content"></article>
        </div>
    </div>
</div>

<div id="main-area">
    <aside id="side-pane">
        <div id="side-pane-header">
            <button id="side-pane-toggle" title="Toggle pane">
                <i id="side-pane-chevron" class="fa-solid fa-chevron-left"></i>
            </button>
            <div id="side-pane-tabs">
                <button class="side-tab active" data-tab="datasources">Datasources</button>
                <button class="side-tab" data-tab="widgets">Widgets</button>
            </div>
        </div>
        <div id="side-tab-datasources" class="side-tab-content">
            <div id="side-pane-list">
                <div class="datasource-list-container">
                    <table class="table table-condensed sub-table" id="datasources-list" data-bind="if: datasources().length">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Last Updated</th>
                                <th>&nbsp;</th>
                            </tr>
                        </thead>
                        <tbody data-bind="foreach: datasources">
                            <tr data-bind="css: { 'datasource-paused': isPaused, 'datasource-selected': $root.selectedDatasource() === $data }, click: $root.selectDatasource">
                                <td>
                                    <span class="datasource-name" data-bind="text: name"></span>
                                </td>
                                <td data-bind="text: last_updated"></td>
                                <td>
                                    <ul class="board-toolbar">
                                        <li data-bind="click: updateNow"><i class="icon-refresh icon-white"></i></li>
                                        <li data-bind="click: togglePause, attr: { title: isPaused() ? 'Resume datasource' : 'Pause datasource' }">
                                            <i class="fa-solid" data-bind="css: { 'fa-pause': !isPaused(), 'fa-play': isPaused() }"></i>
                                        </li>
                                        <li data-bind="pluginEditor: {operation: 'delete', type: 'datasource'}">
                                            <i class="icon-trash icon-white"></i>
                                        </li>
                                    </ul>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- ko if: allow_edit -->
                <span class="text-button table-operation" data-bind="pluginEditor: {operation: 'add', type: 'datasource'}">ADD</span>
                <!-- /ko -->
            </div>
            <div id="side-pane-resizer" title="Drag to resize"></div>
            <div id="side-pane-detail">
                <!-- ko ifnot: selectedDatasource -->
                <p class="detail-empty">Select a datasource to view its settings.</p>
                <!-- /ko -->
                <!-- ko with: selectedDatasource -->
                <form class="detail-form" data-bind="submit: saveInlineSettings">
                    <div class="detail-field">
                        <label class="detail-label">Name</label>
                        <input class="detail-input" type="text" data-bind="value: _editableName, valueUpdate: 'input'" placeholder="Datasource name">
                    </div>
                    <div class="detail-field">
                        <label class="detail-label">Type</label>
                        <span class="detail-readonly" data-bind="text: displayType"></span>
                    </div>
                    <!-- ko foreach: _editableFields -->
                    <div class="detail-field">
                        <label class="detail-label" data-bind="text: def.display_name || def.name, attr: { title: def.description || '' }"></label>
                        <!-- ko if: def.type === 'boolean' -->
                        <input type="checkbox" data-bind="checked: value">
                        <!-- /ko -->
                        <!-- ko if: def.type === 'option' -->
                        <select class="detail-select" data-bind="value: value, options: options, optionsText: 'display', optionsValue: 'value'"></select>
                        <!-- /ko -->
                        <!-- ko if: def.type === 'channel_map' -->
                        <div data-bind="channelMapEditor: { value: value, count: def.channelCount || 8, dsName: $parent.name(), dsType: $parent.type(), lastUpdated: $parent.last_updated }"></div>
                        <!-- /ko -->
                        <!-- ko if: def.type !== 'boolean' && def.type !== 'option' && def.type !== 'channel_map' -->
                        <input class="detail-input" data-bind="value: value, valueUpdate: 'input', attr: { type: def.type === 'number' ? 'number' : 'text', placeholder: def.placeholder || '' }">
                        <!-- /ko -->
                    </div>
                    <!-- /ko -->
                    <div class="detail-actions">
                        <button type="submit" class="detail-btn primary">Save</button>
                        <button type="button" class="detail-btn" data-bind="click: buildEditableFields">Reset</button>
                        <button type="button" class="detail-btn" data-bind="click: updateNow" title="Refresh now">Refresh</button>
                        <button type="button" class="detail-btn" data-bind="click: togglePause, attr: { title: isPaused() ? 'Resume' : 'Pause' }">
                            <!-- ko if: isPaused() -->Resume<!-- /ko --><!-- ko ifnot: isPaused() -->Pause<!-- /ko -->
                        </button>
                        <button type="button" class="detail-btn danger" data-bind="pluginEditor: {operation: 'delete', type: 'datasource'}">Delete</button>
                    </div>
                    <div class="detail-status">
                        Last updated: <span data-bind="text: last_updated"></span>
                    </div>
                </form>
                <!-- /ko -->
            </div>
        </div>
        <div id="side-tab-widgets" class="side-tab-content" style="display:none">
            <div id="widget-pane-list">
                <!-- ko ifnot: panes().length -->
                <p class="widget-list-empty">No panes yet. Add a pane to the dashboard first.</p>
                <!-- /ko -->
                <!-- ko foreach: panes -->
                <!-- ko if: widgets().length -->
                <div class="widget-group">
                    <div class="widget-group-title" data-bind="pluginEditor: {operation: 'edit', type: 'pane'}, text: title() || '(Untitled pane)'" title="Edit pane"></div>
                    <!-- ko foreach: widgets -->
                    <div class="widget-list-item" data-bind="pluginEditor: {operation: 'edit', type: 'widget'}" title="Edit widget">
                        <span class="widget-list-name" data-bind="text: displayTitle"></span>
                        <span class="widget-list-type" data-bind="text: type"></span>
                    </div>
                    <!-- /ko -->
                </div>
                <!-- /ko -->
                <!-- /ko -->
            </div>
        </div>
    </aside>
    <div id="board-content">
        <img id="dash-logo" data-bind="attr:{src: header_image}, visible:header_image()">
        <div class="gridster responsive-column-width">
            <ul data-bind="grid: true">
            </ul>
        </div>
    </div>
</div>

<!-- App-level tabs pinned to the bottom of the viewport. -->
<div id="app-tabs" class="app-tabs">
    <div id="tab-strip" class="tab-strip">
        <button class="tab active" data-tab-id="dashboard" draggable="false">Dashboard</button>
    </div>
</div>

<div style="display:hidden">
    <ul data-bind="template: { name: 'pane-template', foreach: panes}">
    </ul>
</div>

<script type="text/html" id="pane-template">
    <li data-bind="pane: true">
        <header class="pane-header">
            <div class="pane-drag-handle" title="Drag to move pane"></div>
            <h1 data-bind="text: title"></h1>
            <ul class="board-toolbar pane-tools">
                <li data-bind="pluginEditor: {operation: 'add', type: 'widget'}" title="Add widget">
                    <i class="icon-plus icon-white"></i>
                </li>
                <li class="tool-edit" data-bind="pluginEditor: {operation: 'edit', type: 'pane'}" title="Pane parameters">
                    <i class="icon-wrench icon-white"></i>
                </li>
                <li data-bind="click: $root.clonePane" title="Duplicate pane">
                    <i class="fa-solid fa-clone icon-white"></i>
                </li>
                <li class="toolbar-separator">|</li>
                <li class="tool-delete" data-bind="pluginEditor: {operation: 'delete', type: 'pane'}" title="Delete pane">
                    <i class="icon-trash icon-white"></i>
                </li>
            </ul>
        </header>
        <section data-bind="foreach: widgets">
            <div class="sub-section" data-bind="css: 'sub-section-height-' + height()">
                <div class="widget" data-bind="widget: true, css:{fillsize:fillSize}"></div>
                <div class="sub-section-tools">
                    <span class="widget-tools-title" data-bind="text: displayTitle"></span>
                    <ul class="board-toolbar">
                        <!-- ko if:$parent.widgetCanMoveUp($data) -->
                        <li data-bind="click:$parent.moveWidgetUp"><i class="icon-chevron-up icon-white"></i></li>
                        <!-- /ko -->
                        <!-- ko if:$parent.widgetCanMoveDown($data) -->
                        <li data-bind="click:$parent.moveWidgetDown"><i class="icon-chevron-down icon-white"></i></li>
                        <!-- /ko -->
                        <!-- Widget docs quick-open (question mark). -->
                        <li class="tool-help" data-bind="widgetDocs: true" title="Widget docs">
                            <i class="icon-question-sign icon-white"></i>
                            <span class="help-icon">?</span>
                        </li>
                        <li class="tool-edit" data-bind="pluginEditor: {operation: 'edit', type: 'widget'}"><i class="icon-wrench icon-white"></i></li>
                        <li class="toolbar-separator">|</li>
                        <li class="tool-delete" data-bind="pluginEditor: {operation: 'delete', type: 'widget'}"><i class="icon-trash icon-white"></i></li>
                    </ul>
                </div>
            </div>
        </section>
    </li>
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Tabs controller for in-app documentation. -->
<script src="js/tabs.js"></script>
<!-- Side pane resize handle. -->
<script src="js/side_pane.js"></script>
<script src="js/theme.js"></script>
<script src="js/zoom_control.js"></script>
<!-- Extension Manager modal (spawned via Edit → Extension Manager menu). -->
<script src="js/extension_manager.js"></script>

</body>
</html>
