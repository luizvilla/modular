<!DOCTYPE html>
<!-- Standalone example viewer for offline documentation and actions. -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Modular Examples</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="example_viewer.css" />
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="title-block">
            <h1 id="example-title">Example</h1>
            <p id="example-subtitle" class="subtitle">TWIST</p>
        </div>
        <!-- Example selector populated from dashboard/docs/examples. -->
        <div class="example-picker">
            <label for="example-select">Example</label>
            <select id="example-select"></select>
        </div>
        <div class="actions">
            <button id="load-dashboard-btn" class="btn primary">Load example dashboard</button>
            <button id="upload-firmware-btn" class="btn">Upload example to target</button>
            <!-- Progress panel mirrors the Activity Center DFU progress rendering. -->
            <section class="progress-panel">
                <div class="progress-header">
                    <span id="upload-spinner" class="spinner-border spinner-border-sm text-secondary" role="status" aria-hidden="true"></span>
                    <strong id="upload-title" class="text-truncate">Serial DFU</strong>
                    <small id="upload-state" class="text-muted">idle</small>
                </div>
                <div id="upload-label" class="small text-muted text-truncate">No upload running</div>
                <div class="progress" style="height:14px;">
                    <div id="upload-progress-bar" class="progress-bar" role="progressbar" style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
                </div>
            </section>
        </div>
        <div class="port-row">
            <label for="port-select">Target port</label>
            <select id="port-select"></select>
            <button id="refresh-ports-btn" class="btn ghost">Refresh</button>
        </div>
        <div id="status-bar" class="status-bar">Ready.</div>
    </header>

    <main>
        <article id="doc-content" class="doc-content"></article>
    </main>

    <script src="example_viewer.js"></script>
</body>
</html>
